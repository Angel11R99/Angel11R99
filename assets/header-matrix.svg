<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Angel Rodríguez Trejo</title>
  <desc id="desc">Animated code rain behind the name Angel Rodríguez Trejo, Backend-first Software Developer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07050c"/>
      <stop offset="0.52" stop-color="#160b21"/>
      <stop offset="1" stop-color="#321044"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="58%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".2"/>
      <stop offset=".55" stop-color="#7c3aed" stop-opacity=".06"/>
      <stop offset="1" stop-color="#07050c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white"/>
      <stop offset=".78" stop-color="white"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge-fade">
      <rect width="1200" height="300" fill="url(#fade)"/>
    </mask>
    <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a78bfa" stroke-opacity=".045"/>
    </pattern>

    <g id="code-column-a" fill="#a78bfa" font-family="Consolas,Courier New,monospace" font-size="13" font-weight="700">
      <text y="0" opacity=".16">01</text>
      <text y="27" opacity=".28">{}</text>
      <text y="54" opacity=".5">=&gt;</text>
      <text y="81" opacity=".9">&lt;/&gt;</text>
      <text y="108" opacity=".38">[]</text>
      <text y="135" opacity=".18">;</text>
    </g>
    <g id="code-column-b" fill="#22d3ee" font-family="Consolas,Courier New,monospace" font-size="12" font-weight="700">
      <text y="0" opacity=".14">#</text>
      <text y="25" opacity=".28">$</text>
      <text y="50" opacity=".58">()</text>
      <text y="75" opacity=".95">01</text>
      <text y="100" opacity=".34">::</text>
      <text y="125" opacity=".16">//</text>
    </g>
  </defs>

  <rect width="1200" height="300" fill="url(#background)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <g mask="url(#edge-fade)">
    <g>
      <use href="#code-column-a" x="36" y="-135"/>
      <use href="#code-column-b" x="88" y="-45"/>
      <use href="#code-column-a" x="145" y="-225"/>
      <use href="#code-column-b" x="202" y="-95"/>
      <use href="#code-column-a" x="258" y="-20"/>
      <use href="#code-column-b" x="320" y="-195"/>
      <use href="#code-column-a" x="378" y="-80"/>
      <use href="#code-column-b" x="440" y="-250"/>
      <use href="#code-column-a" x="500" y="-155"/>
      <use href="#code-column-b" x="562" y="-55"/>
      <use href="#code-column-a" x="625" y="-240"/>
      <use href="#code-column-b" x="684" y="-120"/>
      <use href="#code-column-a" x="748" y="-30"/>
      <use href="#code-column-b" x="808" y="-205"/>
      <use href="#code-column-a" x="870" y="-95"/>
      <use href="#code-column-b" x="930" y="-265"/>
      <use href="#code-column-a" x="992" y="-160"/>
      <use href="#code-column-b" x="1052" y="-60"/>
      <use href="#code-column-a" x="1112" y="-220"/>
      <use href="#code-column-b" x="1162" y="-110"/>
      <g transform="translate(0 -450)">
        <use href="#code-column-a" x="36" y="-135"/>
        <use href="#code-column-b" x="88" y="-45"/>
        <use href="#code-column-a" x="145" y="-225"/>
        <use href="#code-column-b" x="202" y="-95"/>
        <use href="#code-column-a" x="258" y="-20"/>
        <use href="#code-column-b" x="320" y="-195"/>
        <use href="#code-column-a" x="378" y="-80"/>
        <use href="#code-column-b" x="440" y="-250"/>
        <use href="#code-column-a" x="500" y="-155"/>
        <use href="#code-column-b" x="562" y="-55"/>
        <use href="#code-column-a" x="625" y="-240"/>
        <use href="#code-column-b" x="684" y="-120"/>
        <use href="#code-column-a" x="748" y="-30"/>
        <use href="#code-column-b" x="808" y="-205"/>
        <use href="#code-column-a" x="870" y="-95"/>
        <use href="#code-column-b" x="930" y="-265"/>
        <use href="#code-column-a" x="992" y="-160"/>
        <use href="#code-column-b" x="1052" y="-60"/>
        <use href="#code-column-a" x="1112" y="-220"/>
        <use href="#code-column-b" x="1162" y="-110"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 450" dur="7s" calcMode="linear" repeatCount="indefinite"/>
    </g>
    <g opacity=".7">
      <use href="#code-column-b" x="14" y="-220"/>
      <use href="#code-column-a" x="116" y="-80"/>
      <use href="#code-column-b" x="228" y="-285"/>
      <use href="#code-column-a" x="346" y="-175"/>
      <use href="#code-column-b" x="470" y="-60"/>
      <use href="#code-column-a" x="590" y="-265"/>
      <use href="#code-column-b" x="712" y="-150"/>
      <use href="#code-column-a" x="836" y="-45"/>
      <use href="#code-column-b" x="956" y="-240"/>
      <use href="#code-column-a" x="1076" y="-125"/>
      <g transform="translate(0 -450)">
        <use href="#code-column-b" x="14" y="-220"/>
        <use href="#code-column-a" x="116" y="-80"/>
        <use href="#code-column-b" x="228" y="-285"/>
        <use href="#code-column-a" x="346" y="-175"/>
        <use href="#code-column-b" x="470" y="-60"/>
        <use href="#code-column-a" x="590" y="-265"/>
        <use href="#code-column-b" x="712" y="-150"/>
        <use href="#code-column-a" x="836" y="-45"/>
        <use href="#code-column-b" x="956" y="-240"/>
        <use href="#code-column-a" x="1076" y="-125"/>
      </g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 450" dur="10s" calcMode="linear" repeatCount="indefinite"/>
    </g>
  </g>

  <rect x="173" y="72" width="854" height="156" rx="18" fill="#09070e" fill-opacity=".62" stroke="#a78bfa" stroke-opacity=".16"/>
  <path d="M218 91h42M940 209h42" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".8">
    <animate attributeName="opacity" values=".25;.9;.25" dur="2.8s" repeatCount="indefinite"/>
  </path>

  <g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="600" y="146" fill="#f8fafc" font-size="50" font-weight="700" letter-spacing="-.8">Angel Rodríguez Trejo</text>
    <text x="600" y="188" fill="#d8d3e5" font-size="18" font-weight="600" letter-spacing="1.2">BACKEND-FIRST SOFTWARE DEVELOPER  •  WEB  •  MOBILE  •  DESKTOP</text>
  </g>

  <g fill="#22d3ee" filter="url(#soft-glow)">
    <rect x="209" y="87" width="4" height="4" rx="1">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="987" y="205" width="4" height="4" rx="1">
      <animate attributeName="opacity" values="1;.2;1" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path d="M0 276C205 253 356 299 582 279c221-20 373-30 618 0v21H0z" fill="#0b0910" fill-opacity=".8"/>
</svg>
